name: Node microservice CI

on:
  workflow_call:
    secrets:
      token:
        required: true
    inputs:
      node-version:
        required: false
        default: '20'
        type: string
      template-version-command:
        required: false
        default: ''
        type: string
      build-command:
        required: false
        default: 'npm run build'
        type: string
      coverage-command:
        required: false
        default: 'npm run test:cov'
        type: string
      integration-command:
        required: false
        default: 'npm run test:integration'
        type: string
      upload-coverage:
        required: false
        default: true
        type: boolean
      coverage-path:
        required: false
        default: 'coverage'
        type: string
      coverage-artifact-name:
        required: false
        default: 'vitest-coverage-report'
        type: string

env:
  RELEASE_BOT_APP_ID: 4176453

permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Quality, Unit Coverage & Integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.token }}
          owner: ${{ github.repository_owner }}

      - name: Export release bot token
        run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "NPM_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "NODE_AUTH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@ndcmsl'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated versions
        if: ${{ inputs.template-version-command != '' }}
        run: ${{ inputs.template-version-command }}

      - name: Build application
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Run unit suite with coverage
        if: ${{ inputs.coverage-command != '' }}
        run: ${{ inputs.coverage-command }}

      - name: Upload HTML coverage artifact
        if: ${{ always() && inputs.upload-coverage && inputs.coverage-command != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.coverage-path }}
          if-no-files-found: error

      - name: Run integration suite
        if: ${{ inputs.integration-command != '' }}
        env:
          VITEST_INTEGRATION_MONGO_URI: mongodb://127.0.0.1:27017
          VITEST_INTEGRATION_REDIS_HOST: 127.0.0.1
          VITEST_INTEGRATION_REDIS_PORT: 6379
        run: ${{ inputs.integration-command }}
